[package]
name = "ssri2"
version = "0.1.0"
authors = ["cijiugechu <cijiugechu@gmail.com>", "Kat Marchán <kzm@zkat.tech>"]
edition = "2024"
description = "Various utilities for handling Subresource Integrity."
license = "Apache-2.0"
repository = "https://github.com/cijiugechu/ssri2"
homepage = "https://github.com/cijiugechu/ssri2"
readme = "README.md"
rust-version = "1.85.0"

[dependencies]
base64-simd = "0.8.0"
digest = "0.11.3"
hex = "0.4.3"
serde = { version = "1.0.228", optional = true }
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[features]
default = ["serde"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_derive = "1.0.228"
serde_json = "1.0.150"

[[bench]]
name = "integrity"
harness = false
